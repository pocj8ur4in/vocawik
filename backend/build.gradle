import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
	id 'base'
	alias(libs.plugins.spotbugs) apply false
	alias(libs.plugins.spotless)
	alias(libs.plugins.spring.boot) apply false
	alias(libs.plugins.dependency.management) apply false
}

allprojects {
	group = 'com.vocawik'
	version = rootProject.version

	repositories {
		mavenCentral()
	}
}

def javaProjects = subprojects.findAll { it.buildFile.exists() }

spotless {
	format 'gradle', {
		target '*.gradle', 'module/**/*.gradle', 'server/**/*.gradle'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}
}

configure(javaProjects) {
	apply plugin: 'java'
	apply plugin: 'jacoco'
	apply plugin: 'com.github.spotbugs'
	apply plugin: 'com.diffplug.spotless'
	apply plugin: 'io.spring.dependency-management'

	dependencies {
		spotbugsPlugins rootProject.libs.findsecbugs.plugin
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
		}
	}

	tasks.named('test') {
		useJUnitPlatform()
		finalizedBy jacocoTestReport
	}

	jacocoTestReport {
		dependsOn test
		reports {
			xml.required = true
			html.required = true
			csv.required = false
		}
	}

	spotbugs {
		toolVersion = libs.versions.spotbugs.tool.get()
		effort.set(Effort.valueOf('MAX'))
		reportLevel.set(Confidence.valueOf('MEDIUM'))
		excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
	}

	tasks.withType(SpotBugsTask).configureEach {
		reports {
			html.required = true
			xml.required = true
		}
	}

	tasks.named('spotbugsTest') {
		enabled = false
	}

	spotless {
		java {
			target 'src/**/*.java'
			targetExclude "$buildDir/**/*.java", 'bin/**/*.java'
			importOrder()
			removeUnusedImports()
			googleJavaFormat().aosp()
			trimTrailingWhitespace()
			endWithNewline()
		}
		format 'gradle', {
			target '*.gradle'
			trimTrailingWhitespace()
			leadingSpacesToTabs()
			endWithNewline()
		}
	}
}

tasks.named('check') {
	dependsOn spotlessCheck
	dependsOn javaProjects.collect { it.tasks.named('check') }
}
