name: backend-ci
run-name: "backend-ci"

on:
  push:
    branches: [ develop, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    branches: [ develop, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Run required quality checks
        run: ./gradlew --no-daemon spotlessCheck spotbugsMain test jacocoTestReport -x spotlessApply

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/**/build/test-results/test/
            backend/**/build/reports/tests/test/
          if-no-files-found: error

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/**/build/reports/spotbugs/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: backend/module/logging/build/reports/jacoco/test/jacocoTestReport.xml,backend/module/security/build/reports/jacoco/test/jacocoTestReport.xml,backend/module/web/build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          flags: backend
          name: backend
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
